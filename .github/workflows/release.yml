# Manual entry point for releasing the React-Native plugins.
# Collects the release inputs and hands off to the Pre Release workflow.
name: Release

on:
  workflow_dispatch: # manual trigger
    inputs:
      releaseNotes:
        type: string
        description: "Enter the Release note"
        required: true
      releaseTicket:
        type: string
        description: "Enter the Release ticket"
        required: true

jobs:
  pre-release:
    if: contains(fromJSON('["umangmoe", "arshiya-moengage"]'), github.actor)
    uses: ./.github/workflows/pre_release.yml
    with:
      releaseNotes: ${{ github.event.inputs.releaseNotes }}
      releaseTicket: ${{ github.event.inputs.releaseTicket }}
    secrets:
      SDK_BOT_ACCESS_TOKEN: ${{ secrets.SDK_BOT_ACCESS_TOKEN }}
