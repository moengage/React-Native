# Publishes the React-Native plugins staged by the Release workflow to npm and
# creates the GitHub releases. Runs automatically once the Release workflow
# completes successfully, or can be triggered manually. The plugin list and
# release inputs are read from the `release/` JSON files committed by
# pre-release.main.kts.
name: Publish to NPM

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # For workflow_run triggers, only publish when the Release workflow succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Bootstrap checkout: needed so `./source/.github/actions/npm-automation-repo-setup` exists.
      # Always publish from master: the plugins must be published from the freshly
      # merged master, regardless of the ref this workflow was triggered on.
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: source
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SDK_BOT_ACCESS_TOKEN }}
      # Shared setup: checks out sdk-automation-scripts and configures npm.
      - name: Release setup
        uses: ./source/.github/actions/npm-automation-repo-setup
        with:
          sdk_bot_access_token: ${{ secrets.SDK_BOT_ACCESS_TOKEN }}
      - name: Publishing plugins
        working-directory: source
        run: |
          kotlin .github/scripts/release.main.kts
        env:
          GH_TOKEN: ${{ secrets.SDK_BOT_ACCESS_TOKEN }}
      - name: Notify release
        working-directory: source
        # Release notes are read from the inputs file committed by pre-release.main.kts.
        run: |
          RELEASE_NOTES=$(node -p "require('./release/release-workflow-inputs.json').releaseNotes")
          kotlin .github/scripts/notify-release.main.kts "$RELEASE_NOTES"
        env:
          GH_TOKEN: ${{ secrets.SDK_BOT_ACCESS_TOKEN }}
