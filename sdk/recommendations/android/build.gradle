ext {
    moengageNativeBOMVersion = "4.3.0"
    moengagePluginBaseBOMVersion = "4.0.0"
    // Recommendations is not part of the BOMs yet — drop these pins and let the BOMs
    // resolve the versions once both artifacts ship in a BOM release.
    moengageRecommendationsVersion = "0.0.1"
    moengagePluginBaseRecommendationsVersion = "0.0.1"
    kotlinVersion = "2.3.20"
}

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.moengage.android.hybrid.module.config.plugin:com.moengage.android.hybrid.module.config.plugin.gradle.plugin:2.0.0"
    }
}

apply plugin: 'com.moengage.android.hybrid.module.config.plugin'
apply plugin: 'com.facebook.react'

// In AGP 9+ built-in Kotlin's default is true
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(true)
        .get()
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

hybridModuleConfig.configurePlugin {
    kotlinOptions {
        enableJvmTarget = false
        compilerArgs = ['-Xjvm-default=all']
    }
}

android {
    namespace "com.moengage.react.recommendations"
}

dependencies {
    compileOnly('com.facebook.react:react-native')
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    implementation(platform("com.moengage:android-bom:$moengageNativeBOMVersion"))
    api("com.moengage:recommendations:$moengageRecommendationsVersion")

    implementation(platform("com.moengage:plugin-base-bom:$moengagePluginBaseBOMVersion"))
    implementation("com.moengage:plugin-base-recommendations:$moengagePluginBaseRecommendationsVersion")
    compileOnly("com.moengage:plugin-base")
}
