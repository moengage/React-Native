import com.moengage.gradle.android.library.plugin.configs.BuildConfigType

ext {
    moengageNativeBOMVersion = "4.3.0"
    moengagePluginBaseBOMVersion = "4.0.0"
    kotlinVersion = "2.3.20"
}

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:14.2.0"
        classpath "com.moengage.android.hybrid.module.config.plugin:com.moengage.android.hybrid.module.config.plugin.gradle.plugin:2.0.0"
    }
}

apply plugin: 'com.moengage.android.hybrid.module.config.plugin'
apply plugin: "org.jlleitschuh.gradle.ktlint"
apply plugin: 'com.facebook.react'

// In AGP 9+ built-in Kotlin's default is true
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(true)
        .get()
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

hybridModuleConfig.configurePlugin {
    kotlinOptions {
        enableJvmTarget = false
        compilerArgs = ['-Xjvm-default=all']
    }
    buildFeature {
        buildConfigField(
            BuildConfigType.BOOLEAN,
            "IS_NEW_ARCHITECTURE_ENABLED",
            isNewArchitectureEnabled().toString()
        )
    }
}

android {
    namespace "com.moengage.react.cards"
    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch']
                kotlin.srcDirs += ['src/newarch']
            } else {
                java.srcDirs += ['src/oldarch']
                kotlin.srcDirs += ['src/oldarch']
            }
        }
    }
}

dependencies {
    // noinspection GradleDynamicVersion
    compileOnly('com.facebook.react:react-native')
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    implementation(platform("com.moengage:android-bom:$moengageNativeBOMVersion"))
    api("com.moengage:cards-core")

    implementation(platform("com.moengage:plugin-base-bom:$moengagePluginBaseBOMVersion"))
    implementation("com.moengage:plugin-base-cards")
    compileOnly("com.moengage:plugin-base")
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

